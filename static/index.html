<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutube Studio - Premium Uploader</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d4d;
            --bg: #0f0f12;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at top right, #1a1a2e, #0f0f12);
        }
        .container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            background: linear-gradient(90deg, #ff4d4d, #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .input-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #888;
            font-weight: 500;
        }
        input, textarea, select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.15);
        }
        input[type="file"] {
            padding: 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #ff4d4d, #ff8c42);
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(255, 77, 77, 0.3);
            margin-top: 1rem;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 77, 77, 0.4);
            filter: brightness(1.1);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.95rem;
            min-height: 1.4rem;
            color: #ccc;
        }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ff8c42);
            width: 0%;
            transition: width 0.4s ease-out;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        }
        a {
            color: #ff8c42;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }
        a:hover {
            border-color: #ff8c42;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rutube Studio</h1>
        <form id="uploadForm">
            <div class="input-group">
                <label>Video File</label>
                <input type="file" id="videoFile" accept="video/*" required>
            </div>
            <div class="input-group">
                <label>Title</label>
                <input type="text" id="title" placeholder="Stunning video title" required>
            </div>
            <div class="input-group">
                <label>Description</label>
                <textarea id="description" rows="2" placeholder="Tell viewers about your video"></textarea>
            </div>
            <div class="input-group">
                <label>Category</label>
                <select id="category">
                    <option value="63">Religion</option>
                    <option value="1">News & Politics</option>
                    <option value="4">Entertainment</option>
                    <option value="5">Games</option>
                    <option value="12">Music</option>
                </select>
            </div>
            <button type="submit" class="btn" id="submitBtn">Upload & Publish</button>
        </form>
        <div class="status" id="status">Ready to upload</div>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const status = document.getElementById('status');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const submitBtn = document.getElementById('submitBtn');

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('videoFile');
            const file = fileInput.files[0];
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const category = document.getElementById('category').value;

            if (!file) return;

            submitBtn.disabled = true;
            status.textContent = 'Preparing video...';
            status.style.color = '#ccc';
            progressBar.style.display = 'block';
            progressFill.style.width = '10%';

            const formData = new FormData();
            formData.append('video', file);
            formData.append('title', title);
            formData.append('description', description);
            formData.append('category', category);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    progressFill.style.width = '100%';
                    status.innerHTML = `✓ Upload complete! <br> <a href="${result.url}" target="_blank">Watch Now</a>`;
                } else {
                    const err = await response.text();
                    status.textContent = '❌ ' + err;
                    status.style.color = '#ff4d4d';
                    progressFill.style.background = '#ff4d4d';
                }
            } catch (e) {
                status.textContent = '❌ Connection lost with server';
                status.style.color = '#ff4d4d';
            } finally {
                submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
